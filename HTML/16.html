<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page</title>
    <style>
      body {
        background-color: black;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(5, auto);
      }
      .box {
        grid-area: 1 / 1 / 3 / 3;
        padding: 2px;
        margin: 2px;
        border: solid white 2px;
        color: white;
        width: fit-content;
        height: fit-content;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">PPP</div>
      <div class="box">AAA</div>
      <div class="box">BBB</div>
      <div class="box">CCC</div>
    </div>
  </body>
</html>
